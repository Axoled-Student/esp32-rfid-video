name: Build iPad unlock clip (temporary)

on:
  push:
    paths:
      - '.github/workflows/build-ipad-unlock.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build unlock.mp4 from the known-working 1.mp4
        run: |
          set -euxo pipefail

          # Keep the exact H.264 video bitstream Safari already plays successfully.
          # Replace only the audio with AAC-LC digital silence.
          ffmpeg -y -hide_banner -loglevel error             -i videos/1.mp4             -t 1             -map 0:v:0 -map 0:a:0             -c:v copy             -af volume=0             -c:a aac -profile:a aac_low -b:a 96k -ac 2             -movflags +faststart             videos/unlock.mp4

          echo "=== Source video stream ==="
          ffprobe -v error -select_streams v:0             -show_entries stream=codec_name,profile,width,height,pix_fmt             -of default=nw=1 videos/1.mp4

          echo "=== Unlock video stream ==="
          ffprobe -v error -select_streams v:0             -show_entries stream=codec_name,profile,width,height,pix_fmt             -of default=nw=1 videos/unlock.mp4

          echo "=== Unlock audio stream ==="
          ffprobe -v error -select_streams a:0             -show_entries stream=codec_name,profile,sample_rate,channels             -of default=nw=1 videos/unlock.mp4

          # Full decode must succeed.
          ffmpeg -v error -i videos/unlock.mp4 -f null -

          # Audio must exist AND be digital silence.
          ffmpeg -hide_banner -i videos/unlock.mp4 -map 0:a:0             -af volumedetect -f null - 2> /tmp/vol.txt
          cat /tmp/vol.txt
          grep -q 'max_volume: -inf dB' /tmp/vol.txt

          # Sanity checks.
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 videos/unlock.mp4)" = "h264"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 videos/unlock.mp4)" = "aac"

      - name: Commit generated clip and remove temporary workflow
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos/unlock.mp4
          git rm .github/workflows/build-ipad-unlock.yml
          git commit -m "Build verified silent unlock clip from 1.mp4"
          git push
