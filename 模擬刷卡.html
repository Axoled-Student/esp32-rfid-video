<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模擬刷卡</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
<style>
  .wrap { max-width:640px; }

  .pad { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }

  .pad button {
    aspect-ratio:1; font-size:1.7rem; font-weight:700;
    background:var(--surface); color:var(--text);
    border:1px solid var(--line-soft); border-radius:var(--r);
    padding:0; transition:.13s;
  }
  .pad button:hover:not(:disabled) {
    background:var(--accent); border-color:var(--accent);
    transform:translateY(-2px);
  }
  .pad button:active:not(:disabled) { transform:translateY(0) scale(.96); }
  .pad button:disabled { opacity:.3; }

  /* 剛送出的那一顆閃一下，確認有按到 */
  .pad button.sent {
    animation:flash .55s ease-out;
  }
  @keyframes flash {
    0%   { background:var(--ok); border-color:var(--ok); color:#04180d; }
    100% { background:var(--surface); border-color:var(--line-soft); color:var(--text); }
  }

  .steps {
    list-style:none; counter-reset:s;
    font-size:.88rem; color:var(--text-dim); line-height:1.9;
  }
  .steps li { counter-increment:s; padding-left:26px; position:relative; }
  .steps li::before {
    content:counter(s); position:absolute; left:0; top:.42em;
    width:17px; height:17px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--line);
    font-size:.68rem; font-weight:700; color:var(--text-dim);
    display:grid; place-items:center; line-height:1;
  }
  .steps a { color:var(--accent); text-decoration:none; }
  .steps a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="page">
<div class="wrap">

  <div class="head">
    <h1>模擬刷卡</h1>
    <p>ESP32 還沒接好時，用這頁假裝刷卡，測試播放頁會不會動。</p>
  </div>

  <div class="card">
    <div class="status busy" id="status" style="margin-bottom:18px">
      <span class="led"></span><span id="statusText">連線中…</span>
    </div>

    <div class="pad" id="pad"></div>

    <div class="log" id="log" style="margin-top:18px">正在連接中繼站…</div>
  </div>

  <div class="card">
    <h2>怎麼測</h2>
    <ol class="steps">
      <li>另開一個分頁到 <a href="play.html" target="_blank">播放頁</a>，點一下畫面解鎖</li>
      <li>回到這頁，等狀態變成「已連線」</li>
      <li>按任一個數字，播放頁就會播對應的影片</li>
    </ol>
  </div>

  <div class="nav">
    <a href="./">◱ 測試頁</a>
    <a href="play.html">▶ 刷卡播放頁</a>
    <a href="upload.html">↑ 上傳／換影片</a>
  </div>

</div>
</div>

<script src="assets/config.js"></script>
<script>
let seq = 0;

// 每次重新整理都換一個開機識別碼，播放頁才知道這是新的一輪
const boot = Math.random().toString(36).slice(2, 8);

/* ── 建立數字鍵盤 ──────────────────────────────────────── */

const pad = $('#pad');
SLOTS.forEach(n => {
  const card = cardOf(n);
  const b = document.createElement('button');
  b.textContent = n;
  b.disabled = true;
  b.title = card.title || `第 ${n} 張`;      // 滑鼠移上去看得到是什麼
  b.onclick = () => send(n, b);
  pad.appendChild(b);
});

/* ── 記錄 ──────────────────────────────────────────────── */

function log(msg, cls = '') {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  $('#log').appendChild(d);
  $('#log').scrollTop = $('#log').scrollHeight;
}

function setStatus(text, cls = 'busy') {
  $('#status').className = 'status ' + cls;
  $('#statusText').textContent = text;
}

/* ── 自動連線（不用填代號）───────────────────────────────── */

$('#log').textContent = '';
log('連接 broker.hivemq.com …', 'dim');

const client = connectMqtt('sim');

client.on('connect', () => {
  setStatus('已連線，可以按了', 'ok');
  log('連線成功', 'ok');
  $$('.pad button').forEach(b => b.disabled = false);
});

client.on('reconnect', () => {
  setStatus('重新連線中…', 'busy');
  $$('.pad button').forEach(b => b.disabled = true);
});

client.on('offline', () => {
  setStatus('離線', 'bad');
  $$('.pad button').forEach(b => b.disabled = true);
});

client.on('error', e => {
  setStatus('連線失敗', 'bad');
  log('錯誤：' + (e.message || e), 'err');
});

/* ── 送出「刷卡了」 ────────────────────────────────────── */

function send(n, btn) {
  if (!client.connected) return;

  seq++;

  // retain:false —— 不要讓中繼站幫我們留著這則訊息，
  // 否則播放頁下次一開就會莫名其妙自己播一部（原本的老毛病）
  client.publish(
    CONFIG.TOPIC,
    JSON.stringify({ type: 'play', video: n, seq, boot }),
    { retain: false }
  );

  btn.classList.remove('sent');
  void btn.offsetWidth;          // 強制重跑動畫
  btn.classList.add('sent');

  log(`送出 → ${cardOf(n).title || '第 ' + n + ' 張'}`, 'ok');
}
</script>
</body>
</html>
