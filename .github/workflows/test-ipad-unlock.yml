name: Test iPad unlock fix (temporary)

on:
  push:
    paths:
      - '.github/workflows/test-ipad-unlock.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start local web server
        run: |
          python3 -m http.server 8899 >/tmp/http.log 2>&1 &
          echo $! > /tmp/http.pid
          sleep 2
          curl -f http://127.0.0.1:8899/play.html >/dev/null

      - name: Run smoke tests
        run: node tests/smoke.mjs

      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/test-ipad-unlock.yml
          git commit -m "Remove temporary unlock test workflow"
          git push
