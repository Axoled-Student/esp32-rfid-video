name: Build iPad unlock clip

on:
  push:
    branches:
      - fix/ipad-unlock-from-working-video
    paths:
      - '.github/workflows/build-ipad-unlock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipad-unlock-from-working-video

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build and verify Safari unlock clip
        run: |
          set -euxo pipefail
          ffprobe -v error -show_entries stream=index,codec_name,profile,codec_tag_string,pix_fmt,width,height,sample_rate,channels -of json videos/1.mp4

          # Keep the exact H.264 video bitstream from 1.mp4, which is already
          # proven to play on the target iPad. Only replace its audio with silence.
          ffmpeg -y -hide_banner -loglevel warning -i videos/1.mp4 -t 5 -map 0:v:0 -map 0:a:0 -c:v copy -af volume=0 -c:a aac -b:a 128k -movflags +faststart videos/ipad_unlock_silent.mp4

          ffprobe -v error -show_entries stream=index,codec_name,profile,codec_tag_string,pix_fmt,width,height,sample_rate,channels:format=duration,size -of json videos/ipad_unlock_silent.mp4
          ffmpeg -v error -i videos/ipad_unlock_silent.mp4 -f null -

          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 videos/ipad_unlock_silent.mp4)" = "aac"

          ffmpeg -hide_banner -i videos/ipad_unlock_silent.mp4 -map 0:a:0 -af volumedetect -f null - 2> /tmp/volume.txt
          cat /tmp/volume.txt
          max_db="$(sed -n 's/.*max_volume: \([-0-9.]*\) dB.*/\1/p' /tmp/volume.txt | tail -1)"
          echo "decoded max volume: $max_db dBFS"
          test -n "$max_db"
          awk -v db="$max_db" 'BEGIN { exit !(db <= -80) }'

          for field in codec_name codec_tag_string profile pix_fmt; do
            src="$(ffprobe -v error -select_streams v:0 -show_entries stream=$field -of default=nw=1:nk=1 videos/1.mp4)"
            out="$(ffprobe -v error -select_streams v:0 -show_entries stream=$field -of default=nw=1:nk=1 videos/ipad_unlock_silent.mp4)"
            echo "$field: source=$src output=$out"
            test "$src" = "$out"
          done

      - name: Commit generated clip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/ipad_unlock_silent.mp4
          git commit -m "Build iPad unlock clip from working 1.mp4"
          git push
