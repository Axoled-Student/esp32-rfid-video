name: 轉檔影片

# 什麼時候會跑：
#   1. raw/ 資料夾有新影片推上來
#   2. 你在 Actions 頁面手動按按鈕
on:
  push:
    paths:
      - 'raw/**'
  workflow_dispatch:

permissions:
  contents: write

# 同時只跑一個，避免兩次上傳打架
concurrency:
  group: convert-videos
  cancel-in-progress: false

env:
  # 轉完之後要不要把 raw/ 的原始影片刪掉。
  # 建議 true —— GitHub Pages 有容量限制，原始檔留著會佔掉一倍空間，
  # 而且原始檔也會被公開，通常沒必要。
  DELETE_RAW: 'true'

  # 畫質：數字越大檔案越小、也越糊。26 是平衡點，太大傳不上去就調 30。
  CRF: '26'

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: 下載 repo
        uses: actions/checkout@v4

      - name: 安裝 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      # ────────────────────────────────────────────────
      #  大影片上傳時會被切成 1.mp4.part001、1.mp4.part002…
      #  這裡照順序接回原本的檔案
      # ────────────────────────────────────────────────
      - name: 把分段上傳的檔案接回來
        run: |
          shopt -s nullglob
          joined=0

          for first in raw/*.part001; do
            base="${first%.part001}"
            parts=("$base".part[0-9][0-9][0-9])

            # 檢查編號有沒有斷掉。少一塊接起來就是壞檔，
            # 與其產生一個播不出來的影片，不如直接跳過講清楚。
            expected=1
            broken=0
            for p in "${parts[@]}"; do
              want="$base.part$(printf '%03d' $expected)"
              if [ "$p" != "$want" ]; then
                echo "::error::$base 的分段不完整（少了 $want），跳過。請重新上傳這一部。"
                broken=1
                break
              fi
              expected=$((expected + 1))
            done

            if [ "$broken" = "1" ]; then
              rm -f "${parts[@]}"
              continue
            fi

            echo "▶ $base 由 ${#parts[@]} 塊組成，接合中"
            cat "${parts[@]}" > "$base"
            rm -f "${parts[@]}"
            echo "✓ 接好了，大小 $(du -h "$base" | cut -f1)"
            joined=$((joined + 1))
          done

          echo "接合完成，共 $joined 個檔案"

      # ────────────────────────────────────────────────
      #  轉檔
      #  ⚠ 這一步不能因為單一部影片失敗就整個中斷，
      #    否則其他成功的也會一起白做。所以每部各自處理。
      # ────────────────────────────────────────────────
      - name: 轉檔 raw/ -> videos/
        run: |
          mkdir -p videos
          converted=0; skipped=0; failed=0
          echo "" > /tmp/converted.txt

          for n in 1 2 3 4 5 6 7 8; do
            # 找 raw/1.* 這種檔案，不管副檔名（排除說明文件和碎片）
            src=""
            for f in raw/$n.*; do
              [ -e "$f" ] || continue
              case "$f" in
                *.md|*.txt|*.gitkeep|*.part[0-9][0-9][0-9]) continue ;;
                # 不是影片的東西，直接跳過（例如不小心拖進來的網頁存檔）
                *.html|*.htm|*.pdf|*.zip|*.json|*.jpg|*.jpeg|*.png|*.gif) continue ;;
              esac
              src="$f"; break
            done

            if [ -z "$src" ]; then
              echo "⊘ 第 $n 部：raw/ 裡沒有，跳過"
              skipped=$((skipped + 1))
              continue
            fi

            echo ""
            echo "▶ 第 $n 部：$src  ->  videos/$n.mp4"

            # 先確認這真的是影片，不是改了副檔名的圖片之類的
            if ! ffprobe -v error -select_streams v:0 -show_entries stream=codec_type \
                 -of csv=p=0 "$src" | grep -q video; then
              echo "::error::第 $n 部（$src）不是有效的影片檔"
              failed=$((failed + 1))
              continue
            fi

            # -crf         畫質/大小平衡
            # -vf scale    限制最寬 1280，並確保長寬是偶數（H.264 要求）
            # -pix_fmt     確保所有瀏覽器都解得開
            # -movflags    讓影片可以邊下載邊播（網頁必備）
            # -c:a aac?    有聲音才轉聲音，沒聲音的影片不會因此失敗
            if ffmpeg -y -hide_banner -loglevel warning -i "$src" \
                 -c:v libx264 -preset medium -crf "$CRF" \
                 -vf "scale='min(1280,iw)':-2" \
                 -pix_fmt yuv420p \
                 -c:a aac -b:a 128k -ac 2 \
                 -max_muxing_queue_size 1024 \
                 -movflags +faststart \
                 "videos/$n.mp4"
            then
              # 轉出來的檔案要真的有內容才算數
              dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "videos/$n.mp4" 2>/dev/null || echo 0)
              if [ "$(printf '%.0f' "${dur:-0}")" -lt 1 ]; then
                echo "::error::第 $n 部轉出來是空的"
                rm -f "videos/$n.mp4"
                failed=$((failed + 1))
                continue
              fi

              echo "✓ 第 $n 部完成，$(du -h "videos/$n.mp4" | cut -f1)，長度 ${dur}s"
              echo "$n|$src" >> /tmp/converted.txt
              converted=$((converted + 1))
            else
              echo "::error::第 $n 部轉檔失敗"
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "===================================="
          echo "  完成 $converted 部 / 跳過 $skipped 部 / 失敗 $failed 部"
          echo "===================================="

          # 有失敗的先記著，最後再回報，不要現在就中斷
          echo "FAILED_COUNT=$failed" >> "$GITHUB_ENV"

      # ────────────────────────────────────────────────
      #  太大的檔案 GitHub 收不下，這裡自動降畫質重轉一次，
      #  而不是直接放棄（原本會讓整批都不 commit）
      # ────────────────────────────────────────────────
      - name: 檢查檔案大小
        run: |
          shopt -s nullglob
          oversize=0

          for f in videos/*.mp4; do
            bytes=$(stat -c%s "$f")
            mb=$((bytes / 1048576))

            if [ "$bytes" -le 104857600 ]; then
              echo "✓ $f  ${mb}MB"
              continue
            fi

            echo "⚠ $f 有 ${mb}MB，超過 100MB，自動降畫質重轉"

            n=$(basename "$f" .mp4)
            src=$(grep "^$n|" /tmp/converted.txt | cut -d'|' -f2)

            if [ -z "$src" ] || [ ! -e "$src" ]; then
              echo "::error::找不到 $f 的原始檔，無法重轉"
              rm -f "$f"; oversize=$((oversize + 1)); continue
            fi

            # 降畫質 + 縮到 854 寬，通常能壓到一半以下
            ffmpeg -y -hide_banner -loglevel warning -i "$src" \
              -c:v libx264 -preset medium -crf 32 \
              -vf "scale='min(854,iw)':-2" \
              -pix_fmt yuv420p -c:a aac -b:a 96k -ac 2 \
              -movflags +faststart "$f.tmp.mp4"

            newbytes=$(stat -c%s "$f.tmp.mp4" 2>/dev/null || echo 0)

            if [ "$newbytes" -gt 0 ] && [ "$newbytes" -le 104857600 ]; then
              mv "$f.tmp.mp4" "$f"
              echo "✓ 重轉後 $((newbytes / 1048576))MB"
            else
              rm -f "$f.tmp.mp4" "$f"
              echo "::error::$f 壓不下來，請把來源影片剪短"
              oversize=$((oversize + 1))
            fi
          done

          echo "OVERSIZE_COUNT=$oversize" >> "$GITHUB_ENV"

      # ────────────────────────────────────────────────
      #  轉完就把原始檔清掉，Pages 才不會被塞爆
      # ────────────────────────────────────────────────
      - name: 清掉已轉好的原始檔
        if: env.DELETE_RAW == 'true'
        run: |
          [ -s /tmp/converted.txt ] || exit 0
          while IFS='|' read -r n src; do
            [ -n "$src" ] || continue
            rm -f "$src" && echo "清掉 $src"
          done < /tmp/converted.txt

      # ────────────────────────────────────────────────
      #  推回 repo
      #  上傳面板可能在這期間又推了新的東西，所以要能重試
      # ────────────────────────────────────────────────
      - name: 推回 repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A videos/ raw/

          if git diff --staged --quiet; then
            echo "沒有變化，不需要 commit"
            exit 0
          fi

          git commit -m "自動轉檔：更新 videos/ [skip ci]"

          for i in 1 2 3; do
            if git push; then
              echo "✓ 已推回，GitHub Pages 約 1~2 分鐘後更新"
              exit 0
            fi
            echo "推送失敗（第 $i 次），拉一下再試"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done

          echo "::error::推送失敗，請重跑這個工作"
          exit 1

      # ────────────────────────────────────────────────
      #  最後才回報失敗。放最後是為了讓成功的部分先存起來。
      # ────────────────────────────────────────────────
      - name: 回報結果
        run: |
          bad=$(( ${FAILED_COUNT:-0} + ${OVERSIZE_COUNT:-0} ))
          if [ "$bad" -gt 0 ]; then
            echo "::error::有 $bad 部影片沒處理成功，其餘已經上線。詳情看上面的紅字。"
            exit 1
          fi
          echo "全部順利完成"
