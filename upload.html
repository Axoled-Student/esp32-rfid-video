<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>影片上傳面板</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .keyrow { display:flex; gap:9px; flex-wrap:wrap; }

  /* 已存金鑰時的小綠勾 */
  .keyrow .saved {
    display:none; align-items:center; gap:6px;
    font-size:.85rem; color:var(--ok);
  }
  .keyrow.has .saved { display:flex; }

  /* ── 影片格子 ── */
  .slot {
    background:var(--bg); border:1.5px dashed var(--line);
    border-radius:var(--r); padding:16px 12px; cursor:pointer;
    text-align:center; transition:.15s; position:relative; overflow:hidden;
  }
  .slot:hover  { border-color:var(--accent); background:#101018; }
  .slot.over   { border-color:var(--accent); background:#101828; border-style:solid; }

  .slot .num   { font-size:1.7rem; font-weight:700; color:var(--text-mute); line-height:1.2; }
  .slot .name  {
    font-size:.76rem; color:var(--text-mute); margin-top:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* 已選檔案 */
  .slot.picked { border-style:solid; border-color:#1c5c3a; background:#0d1a13; }
  .slot.picked .num  { color:var(--ok); }
  .slot.picked .name { color:#86efac; }

  /* 網站上已經有的影片 */
  .slot.online { border-style:solid; border-color:var(--line); }
  .slot.online .num  { color:var(--text-dim); }
  .slot.online .name { color:var(--text-mute); }

  /* 上傳成功 */
  .slot.done { border-color:var(--accent); background:#0d1420; }
  .slot.done .num  { color:var(--accent); }
  .slot.done .name { color:#93c5fd; }

  /* 右上角的清除鈕 */
  .slot .clear {
    position:absolute; top:5px; right:7px;
    width:20px; height:20px; border-radius:50%;
    background:rgba(0,0,0,.55); color:var(--text-dim);
    font-size:.75rem; line-height:20px; display:none;
  }
  .slot.picked .clear { display:block; }
  .slot .clear:hover  { color:var(--err); background:rgba(0,0,0,.8); }

  #progress { display:none; margin-top:18px; }

  .callout {
    padding:13px 15px; border-radius:var(--r-sm); font-size:.88rem;
    background:var(--surface-2); border:1px solid var(--line-soft);
    color:var(--text-dim); margin-top:14px;
  }
  .callout a { color:var(--accent); text-decoration:none; }
  .callout a:hover { text-decoration:underline; }
  .callout.ok { background:#0d1f16; border-color:#1c5c3a; color:#86efac; }
</style>
</head>
<body>
<div class="page">
<div class="wrap">

  <div class="head">
    <h1>影片上傳面板</h1>
    <p>選好影片按上傳，雲端會自動轉檔，什麼格式都吃。</p>
  </div>

  <!-- 步驟 1 -->
  <div class="card">
    <h2><span class="step">1</span>貼上金鑰</h2>
    <div class="keyrow" id="keyrow">
      <input type="password" id="token" placeholder="ghp_ 開頭那一串" autocomplete="off" spellcheck="false">
      <button class="ghost" id="saveKey">記住</button>
      <span class="saved">✓ 已記住</span>
    </div>
    <p class="hint">
      金鑰只存在你自己的瀏覽器，不會傳給別人。權限要勾 <code>repo</code>。
      <a href="https://github.com/settings/tokens/new?scopes=repo,workflow&description=影片上傳面板" target="_blank" rel="noopener">去拿一組 →</a>
    </p>
  </div>

  <!-- 步驟 2 -->
  <div class="card">
    <h2><span class="step">2</span>選影片</h2>
    <div id="siteNote" class="callout" style="margin-top:0;margin-bottom:14px;display:none"></div>
    <div class="grid" id="slots"></div>
    <p class="hint">點格子選檔案，或直接把影片拖進來。不用 8 部都換，換幾部選幾部。單檔上限 100MB。</p>
  </div>

  <!-- 步驟 3 -->
  <div class="card">
    <h2><span class="step">3</span>上傳</h2>
    <div class="btn-row">
      <button id="go" style="flex:1;min-width:170px">開始上傳</button>
      <button class="ghost" id="viewActions">看轉檔進度</button>
    </div>

    <div id="progress">
      <div class="bar"><i id="barFill"></i></div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div class="nav">
    <a href="./">◱ 測試頁</a>
    <a href="play.html">▶ 刷卡播放頁</a>
    <a href="模擬刷卡.html">⊹ 模擬刷卡</a>
  </div>

</div>
</div>

<script src="assets/config.js"></script>
<script>
const { OWNER, REPO, BRANCH } = CONFIG;

const files = {};              // { 1: File, 2: File, ... }

/* ══════════════════════════════════════════════════════
 *  金鑰
 * ══════════════════════════════════════════════════════ */

const savedKey = localStorage.getItem('ghToken');
if (savedKey) {
  $('#token').value = savedKey;
  $('#keyrow').classList.add('has');
}

$('#saveKey').onclick = () => {
  const t = $('#token').value.trim();
  if (!t) {
    localStorage.removeItem('ghToken');
    $('#keyrow').classList.remove('has');
    return;
  }
  localStorage.setItem('ghToken', t);
  $('#keyrow').classList.add('has');
};

$('#viewActions').onclick = () =>
  window.open(`https://github.com/${OWNER}/${REPO}/actions`, '_blank', 'noopener');

/* ══════════════════════════════════════════════════════
 *  8 個格子（點選 + 拖放）
 * ══════════════════════════════════════════════════════ */

const slotsEl = $('#slots');

SLOTS.forEach(n => {
  const d = document.createElement('div');
  d.className = 'slot';
  d.id = 'slot' + n;
  d.innerHTML =
    `<div class="clear" title="取消">✕</div>
     <div class="num">${n}</div>
     <div class="name">點這裡選檔案</div>`;

  d.onclick = e => {
    if (e.target.classList.contains('clear')) { clearSlot(n); return; }
    pick(n);
  };

  // 拖放
  d.addEventListener('dragover', e => {
    e.preventDefault();
    d.classList.add('over');
  });
  d.addEventListener('dragleave', () => d.classList.remove('over'));
  d.addEventListener('drop', e => {
    e.preventDefault();
    d.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) accept(n, f);
  });

  slotsEl.appendChild(d);
});

// 拖到頁面其他地方不要讓瀏覽器直接開檔案
['dragover', 'drop'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault())
);

function pick(n) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'video/*';
  inp.onchange = () => { if (inp.files[0]) accept(n, inp.files[0]); };
  inp.click();
}

// 這些副檔名一定不是影片。拖曳進來的檔案不會經過 accept="video/*"，
// 所以要在這裡自己擋，不然像 .html 這種東西會被當成影片傳上去。
const NOT_VIDEO = /\.(html?|txt|md|pdf|zip|rar|7z|docx?|xlsx?|pptx?|jpe?g|png|gif|webp|svg|mp3|wav|m4a|json|js|css|exe|dmg)$/i;

function accept(n, f) {
  const mb = f.size / 1048576;

  // 副檔名明顯不對，或瀏覽器判定不是影片 → 擋下來
  const looksWrong = NOT_VIDEO.test(f.name) ||
                     (f.type && !f.type.startsWith('video/'));

  if (looksWrong) {
    alert(
      `「${f.name}」看起來不是影片檔。\n\n` +
      '這裡只收影片（mp4 / mov / avi / mkv 等）。\n' +
      '如果你是想讓刷卡打開某個網站，改 assets/config.js 裡的網址就好，不用上傳檔案。'
    );
    return;
  }

  if (mb > 100) {
    alert(`這個檔案有 ${mb.toFixed(0)}MB，超過 GitHub 的 100MB 上限。\n請把影片剪短，或先壓縮一下。`);
    return;
  }

  files[n] = f;
  const el = $('#slot' + n);
  el.className = 'slot picked';
  el.querySelector('.name').textContent = `${f.name} · ${mb.toFixed(1)}MB`;
  el.querySelector('.name').title = f.name;
}

function clearSlot(n) {
  delete files[n];
  const el = $('#slot' + n);
  el.className = 'slot';
  el.querySelector('.name').textContent = '點這裡選檔案';
  markOnline(n);
}

/* ── 標出網站上已經有哪幾部（讓人知道哪些不用重傳）──────── */

const onlineSizes = {};

async function markOnline(n) {
  if (files[n]) return;
  try {
    const r = await fetch(`videos/${n}.mp4`, { method: 'HEAD', cache: 'no-store' });
    if (!r.ok) return;
    const bytes = Number(r.headers.get('content-length') || 0);
    if (bytes < 20000) return;          // 太小，當作沒有

    onlineSizes[n] = bytes;
    const el = $('#slot' + n);
    if (el.classList.contains('picked')) return;
    el.className = 'slot online';
    el.querySelector('.name').textContent = `目前 ${(bytes / 1048576).toFixed(1)}MB`;
  } catch {}
}

SLOTS.forEach(markOnline);

/* ── 目前有幾張卡設定成開網站？提醒一下，免得傳了才發現沒用到 ── */

const siteCards = SLOTS.filter(n => cardOf(n).type === 'site');

if (siteCards.length) {
  const note = $('#siteNote');
  note.style.display = 'block';

  if (siteCards.length === CONFIG.COUNT) {
    note.innerHTML =
      '目前 <b>8 張卡全部設定成開網站</b>，刷卡時不會播影片。' +
      '這裡上傳的影片會先存著，之後在 <code>assets/config.js</code> 把某張卡改成 ' +
      '<code>type: \'video\'</code> 就會用到。';
  } else {
    note.innerHTML =
      `第 ${siteCards.join('、')} 張設定成開網站，這幾張傳影片不會生效。` +
      '要改的話開 <code>assets/config.js</code>。';
  }

  // 網站卡的格子淡一點，一眼看得出差別
  siteCards.forEach(n => {
    const el = $('#slot' + n);
    el.style.opacity = '.45';
    el.title = '這張卡目前設定成開網站：' + (cardOf(n).url || '');
  });
}

/* ══════════════════════════════════════════════════════
 *  記錄
 * ══════════════════════════════════════════════════════ */

function say(msg, cls = '') {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  $('#log').appendChild(line);
  $('#log').scrollTop = $('#log').scrollHeight;
}

const setBar = pct => $('#barFill').style.width = pct + '%';

/* ══════════════════════════════════════════════════════
 *  檔案 → base64（GitHub API 只收這種格式）
 *  一次讀 2MB，讀完轉完就丟，記憶體才不會爆
 * ══════════════════════════════════════════════════════ */

function toBase64(blob, onProgress) {
  return new Promise((resolve, reject) => {
    const CHUNK  = 2 * 1048576;
    const reader = new FileReader();
    let offset = 0;
    let binary = '';

    reader.onerror = () => reject(new Error('讀取檔案失敗'));

    reader.onload = () => {
      const bytes = new Uint8Array(reader.result);
      // 一次組 32KB，太多參數 String.fromCharCode 會爆掉
      for (let i = 0; i < bytes.length; i += 32768) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
      }

      offset = Math.min(offset + CHUNK, blob.size);
      onProgress?.(offset / blob.size);

      if (offset < blob.size) readNext();
      else resolve(btoa(binary));
    };

    function readNext() {
      reader.readAsArrayBuffer(blob.slice(offset, offset + CHUNK));
    }
    readNext();
  });
}

/* ══════════════════════════════════════════════════════
 *  呼叫 GitHub
 * ══════════════════════════════════════════════════════ */

async function gh(path, opts = {}) {
  const token = $('#token').value.trim();
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept':        'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.headers || {}),
    },
  });
  return res;
}

// 抓錯誤訊息，方便看懂哪裡出問題
async function ghError(res) {
  const e = await res.json().catch(() => ({}));
  return e.message || `HTTP ${res.status}`;
}

/* ══════════════════════════════════════════════════════
 *  上傳主流程
 *
 *  重點：全部檔案先變成 blob 傳上去，最後「一次」commit。
 *  這樣不管換幾部影片，轉檔機器人都只會被叫醒一次，
 *  也不會出現傳到一半半新半舊的狀態。
 * ══════════════════════════════════════════════════════ */

$('#go').onclick = async () => {
  const token = $('#token').value.trim();
  const list  = Object.keys(files).map(Number).sort((a, b) => a - b);

  if (!token)       { alert('請先貼上金鑰'); return; }
  if (!list.length) { alert('還沒選任何影片'); return; }

  $('#go').disabled = true;
  $('#go').textContent = '上傳中…';
  $('#progress').style.display = 'block';
  $('#log').innerHTML = '';
  setBar(0);

  // 上傳過程中不小心關掉分頁會很痛，先攔一下
  const guard = e => { e.preventDefault(); e.returnValue = ''; };
  window.addEventListener('beforeunload', guard);

  try {
    /* ── 1. 驗金鑰 ─────────────────────────────────── */
    say('檢查金鑰…', 'dim');
    const check = await gh('');

    if (check.status === 401) { say('金鑰無效或已過期，請重新拿一組', 'err'); return; }
    if (check.status === 403) { say('金鑰權限不足，建立時要勾 repo', 'err'); return; }
    if (check.status === 404) { say('找不到倉庫，或這組金鑰沒有權限', 'err'); return; }
    if (!check.ok)            { say(`連線失敗（${check.status}）`, 'err'); return; }

    const repo = await check.json();
    if (!repo.permissions?.push) {
      say('這組金鑰只能讀、不能寫，請重新建立並勾 repo', 'err');
      return;
    }
    say('金鑰沒問題', 'ok');

    /* ── 2. 讀目前 raw/ 有哪些檔（等下要清掉舊的）───── */
    const oldFiles = [];
    const rawRes = await gh(`/contents/raw?ref=${BRANCH}`);
    if (rawRes.ok) {
      const arr = await rawRes.json();
      if (Array.isArray(arr)) oldFiles.push(...arr.map(f => f.name));
    }

    /* ── 3. 一部一部轉成 blob 送上去 ────────────────── */
    // 總位元組數，拿來算整體進度
    const totalBytes = list.reduce((s, n) => s + files[n].size, 0);
    let doneBytes = 0;

    const treeItems = [];
    const okList = [];

    for (const n of list) {
      const f   = files[n];
      const ext = (f.name.match(/\.[^.]+$/) || ['.mp4'])[0].toLowerCase();
      const mb  = f.size / 1048576;

      say(`\n第 ${n} 部　${f.name}（${mb.toFixed(1)}MB）`);

      // 大檔切塊：GitHub 單次請求約 20MB 上限，切 10MB 保險
      const PART  = 10 * 1048576;
      const parts = Math.ceil(f.size / PART);

      if (parts > 1) say(`  太大，切成 ${parts} 塊送`, 'warn');

      const shas = [];
      let failed = false;

      for (let i = 0; i < parts; i++) {
        const slice = f.slice(i * PART, (i + 1) * PART);
        const label = parts > 1 ? `第 ${i + 1}/${parts} 塊` : '檔案';

        const b64 = await toBase64(slice, p => {
          // 整體進度：已完成的位元組 + 這一塊已讀的比例
          const cur = doneBytes + i * PART + p * slice.size;
          setBar(Math.round((cur / totalBytes) * 85));
        });

        say(`  ${label} 上傳中…`, 'dim');

        const r = await gh('/git/blobs', {
          method: 'POST',
          body: JSON.stringify({ content: b64, encoding: 'base64' }),
        });

        if (!r.ok) {
          say(`  失敗：${await ghError(r)}`, 'err');
          failed = true;
          break;
        }
        shas.push((await r.json()).sha);
      }

      doneBytes += f.size;

      if (failed) {
        say(`  第 ${n} 部沒傳成功，跳過`, 'err');
        continue;
      }

      // 掛進檔案結構：單塊直接 raw/1.mp4，多塊 raw/1.mp4.part001…
      shas.forEach((sha, i) => {
        treeItems.push({
          path: parts === 1
            ? `raw/${n}${ext}`
            : `raw/${n}${ext}.part${String(i + 1).padStart(3, '0')}`,
          mode: '100644', type: 'blob', sha,
        });
      });

      okList.push(n);
      say(`  第 ${n} 部好了`, 'ok');
    }

    if (!okList.length) {
      say('\n沒有任何影片上傳成功', 'err');
      return;
    }

    /* ── 4. 把這幾個編號的舊檔標記成刪除 ─────────────
     * 不刪的話，raw/1.mov 和 raw/1.mp4 會同時存在，
     * 轉檔機器人不知道該用哪個。sha:null = 刪掉。
     * ─────────────────────────────────────────────── */
    const keep = new Set(treeItems.map(t => t.path.replace(/^raw\//, '')));

    for (const name of oldFiles) {
      const m = name.match(/^(\d+)\./);
      if (!m) continue;                          // 說明文件之類的留著
      if (!okList.includes(Number(m[1]))) continue;   // 不是這次換的，不動
      if (keep.has(name)) continue;              // 同名會被覆蓋，不用刪

      treeItems.push({ path: `raw/${name}`, mode: '100644', type: 'blob', sha: null });
    }

    /* ── 5. 一次 commit ─────────────────────────────── */
    say('\n整理檔案結構…', 'dim');
    setBar(90);

    const ok = await commitAll(
      treeItems,
      `上傳影片：第 ${okList.join('、')} 部`
    );

    if (!ok) return;

    setBar(100);
    okList.forEach(n => {
      const el = $('#slot' + n);
      el.className = 'slot done';
      el.querySelector('.name').textContent = '已上傳，轉檔中';
    });

    say('\n────────────────────────');
    say(`上傳完成，共 ${okList.length} 部`, 'ok');
    say('雲端正在自動轉檔，約 3~5 分鐘');

    watchConvert();

  } catch (err) {
    say(`\n出錯了：${err.message}`, 'err');
  } finally {
    window.removeEventListener('beforeunload', guard);
    $('#go').disabled = false;
    $('#go').textContent = '開始上傳';
  }
};

/* ══════════════════════════════════════════════════════
 *  建立一筆 commit，把所有檔案一次掛上去
 * ══════════════════════════════════════════════════════ */

async function commitAll(treeItems, message) {
  // 目前分支停在哪
  const refRes = await gh(`/git/ref/heads/${BRANCH}`);
  if (!refRes.ok) { say(`讀取分支失敗：${await ghError(refRes)}`, 'err'); return false; }
  const baseSha = (await refRes.json()).object.sha;

  const commitRes = await gh(`/git/commits/${baseSha}`);
  if (!commitRes.ok) { say(`讀取紀錄失敗：${await ghError(commitRes)}`, 'err'); return false; }
  const baseTree = (await commitRes.json()).tree.sha;

  // 新的檔案結構
  const treeRes = await gh('/git/trees', {
    method: 'POST',
    body: JSON.stringify({ base_tree: baseTree, tree: treeItems }),
  });
  if (!treeRes.ok) { say(`建立結構失敗：${await ghError(treeRes)}`, 'err'); return false; }
  const newTree = (await treeRes.json()).sha;

  // 新的紀錄
  const newCommitRes = await gh('/git/commits', {
    method: 'POST',
    body: JSON.stringify({ message, tree: newTree, parents: [baseSha] }),
  });
  if (!newCommitRes.ok) { say(`建立紀錄失敗：${await ghError(newCommitRes)}`, 'err'); return false; }
  const newCommit = (await newCommitRes.json()).sha;

  // 分支移過去
  const upd = await gh(`/git/refs/heads/${BRANCH}`, {
    method: 'PATCH',
    body: JSON.stringify({ sha: newCommit }),
  });
  if (!upd.ok) { say(`更新分支失敗：${await ghError(upd)}`, 'err'); return false; }

  return true;
}

/* ══════════════════════════════════════════════════════
 *  自動追蹤轉檔進度，不用自己去 Actions 頁面盯
 * ══════════════════════════════════════════════════════ */

async function watchConvert() {
  say('\n追蹤轉檔進度中…', 'dim');

  let noRunCount = 0;

  for (let i = 0; i < 60; i++) {                 // 最多盯 5 分鐘
    await new Promise(r => setTimeout(r, 5000));

    const r = await gh('/actions/runs?per_page=1');
    if (!r.ok) { say('（讀不到進度，請自己看 Actions 頁面）', 'warn'); return; }

    const run = (await r.json()).workflow_runs?.[0];

    if (!run) {
      if (++noRunCount > 6) { say('（還沒看到轉檔工作，請自己看 Actions 頁面）', 'warn'); return; }
      continue;
    }

    if (run.status === 'completed') {
      if (run.conclusion === 'success') {
        say('轉檔完成，影片已經上線', 'ok');
        say('可以去測試頁確認', 'ok');
      } else {
        say(`轉檔失敗（${run.conclusion}），按「看轉檔進度」查原因`, 'err');
      }
      return;
    }

    if (i % 3 === 0) say(`  轉檔中…（${run.status === 'queued' ? '排隊中' : '進行中'}）`, 'dim');
  }

  say('（等太久了，請按「看轉檔進度」自己看）', 'warn');
}
</script>

</html>
