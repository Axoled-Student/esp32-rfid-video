<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡片設定台</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .wrap { max-width: 860px; }

  .keyrow { display:flex; gap:9px; flex-wrap:wrap; align-items:center; }
  .keyrow .saved {
    display:none; align-items:center; gap:6px;
    font-size:.85rem; color:var(--ok);
  }
  .keyrow.has .saved { display:flex; }

  /* ══ 卡片列表 ══ */
  .cards { display:flex; flex-direction:column; gap:11px; }

  .cardrow {
    background:var(--bg); border:1px solid var(--line-soft);
    border-radius:var(--r); padding:14px 15px;
    transition:border-color .15s, background .15s;
  }
  .cardrow:hover  { border-color:var(--line); }
  .cardrow.over   { border-color:var(--accent); background:#101828; }
  .cardrow.edited { border-color:#6b4a10; background:#1a1508; }
  .cardrow.done   { border-color:#1c5c3a; background:#0d1a13; }

  .cardrow .head-row {
    display:flex; align-items:center; gap:11px; margin-bottom:11px;
  }

  .cardrow .no {
    flex:none; width:28px; height:28px; border-radius:8px;
    background:var(--surface-2); border:1px solid var(--line);
    display:grid; place-items:center;
    font-size:.88rem; font-weight:700; color:var(--text-dim);
  }
  .cardrow.site .no  { background:#132036; border-color:#1e3a5f; color:#93c5fd; }
  .cardrow.video .no { background:#0f1f16; border-color:#1c5c3a; color:#86efac; }

  /* 標題輸入 */
  .cardrow .t-in {
    flex:1; min-width:120px; padding:7px 10px; font-size:.9rem;
    font-family:inherit; background:transparent;
    border:1px solid transparent; border-radius:6px; color:var(--text);
    font-weight:600;
  }
  .cardrow .t-in:hover  { border-color:var(--line-soft); }
  .cardrow .t-in:focus  { border-color:var(--accent); background:var(--bg); outline:none; }

  /* 模式切換 */
  .toggle {
    flex:none; display:flex; background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; overflow:hidden;
  }
  .toggle button {
    padding:7px 13px; font-size:.8rem; font-weight:600;
    background:transparent; color:var(--text-mute);
    border:none; border-radius:0; white-space:nowrap;
  }
  .toggle button:hover:not(.act) { background:#22222c; color:var(--text-dim); }
  .toggle button.act { background:var(--accent); color:#fff; }

  /* 內容區：網址或檔案 */
  .body-row { display:flex; gap:8px; align-items:center; }

  .u-in {
    flex:1; min-width:0; padding:9px 11px; font-size:.85rem;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    background:var(--surface); border:1px solid var(--line);
    border-radius:7px; color:var(--text);
  }
  .u-in:focus { outline:none; border-color:var(--accent); }
  .u-in.bad   { border-color:#7f2222; background:#1a0f10; }

  .pickbtn {
    flex:none; padding:9px 15px; font-size:.85rem;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
  }
  .pickbtn:hover { background:#26262e; }

  .filebox {
    flex:1; min-width:0; padding:9px 11px; font-size:.85rem;
    background:var(--surface); border:1px dashed var(--line);
    border-radius:7px; color:var(--text-mute);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    cursor:pointer;
  }
  .filebox:hover { border-color:var(--accent); color:var(--text-dim); }
  .filebox.has   { border-style:solid; border-color:#1c5c3a; color:#86efac; }

  .testbtn {
    flex:none; padding:9px 12px; font-size:.85rem;
    background:transparent; border:1px solid var(--line-soft);
    color:var(--text-mute);
  }
  .testbtn:hover { color:var(--accent); border-color:var(--accent); }

  /* 狀態小字 */
  .cardrow .note {
    font-size:.76rem; color:var(--text-mute); margin-top:7px;
    display:none;
  }
  .cardrow .note.on { display:block; }
  .cardrow .note.warn { color:var(--warn); }
  .cardrow .note.err  { color:var(--err); }
  .cardrow .note.ok   { color:var(--ok); }

  #progress { display:none; margin-top:18px; }

  .callout {
    padding:13px 15px; border-radius:var(--r-sm); font-size:.87rem;
    background:var(--surface-2); border:1px solid var(--line-soft);
    color:var(--text-dim); margin-top:14px; line-height:1.75;
  }
  .callout a    { color:var(--accent); text-decoration:none; }
  .callout code {
    background:var(--bg); padding:1px 5px; border-radius:4px;
    font-size:.92em; color:var(--text-dim);
  }

  .bar-note {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-size:.85rem; color:var(--text-mute); margin-bottom:12px;
  }
  .chip {
    padding:3px 9px; border-radius:99px; font-size:.76rem; font-weight:600;
    background:var(--surface-2); border:1px solid var(--line-soft);
  }
  .chip.edit { background:#2a2010; border-color:#6b4a10; color:#fcd34d; }

  @media (max-width:600px) {
    .cardrow .head-row { flex-wrap:wrap; }
    .cardrow .t-in { min-width:100%; order:3; }
    .body-row { flex-wrap:wrap; }
    .u-in, .filebox { min-width:100%; }
  }
</style>
</head>
<body>
<div class="page">
<div class="wrap">

  <div class="head">
    <h1>卡片設定台</h1>
    <p>設定 8 張卡各自要開什麼 —— 網站填網址，影片選檔案。</p>
  </div>

  <!-- 步驟 1：金鑰 -->
  <div class="card">
    <h2><span class="step">1</span>貼上金鑰</h2>
    <div class="keyrow" id="keyrow">
      <input type="password" id="token" placeholder="ghp_ 開頭那一串" autocomplete="off" spellcheck="false">
      <button class="ghost" id="saveKey">記住</button>
      <span class="saved">✓ 已記住</span>
    </div>
    <p class="hint">
      金鑰只存在你自己的瀏覽器，不會傳給別人。權限要勾 <code>repo</code>。
      <a href="https://github.com/settings/tokens/new?scopes=repo,workflow&description=卡片設定台" target="_blank" rel="noopener">去拿一組 →</a>
    </p>
  </div>

  <!-- 步驟 2：設定 8 張卡 -->
  <div class="card">
    <h2><span class="step">2</span>設定每張卡</h2>

    <div class="bar-note" id="barNote">
      <span class="chip" id="chipSum">載入中…</span>
      <span id="sumText"></span>
    </div>

    <div class="cards" id="cards"></div>

    <p class="hint">
      網站模式填網址，影片模式點方框選檔案（也可以直接把影片拖進那一列）。
      標題可以直接點下去改，刷卡時會顯示在畫面下方。
    </p>
  </div>

  <!-- 步驟 3：儲存 -->
  <div class="card">
    <h2><span class="step">3</span>儲存</h2>
    <div class="btn-row">
      <button id="go" style="flex:1;min-width:170px">儲存設定</button>
      <button class="ghost" id="reload">重新載入</button>
      <button class="ghost" id="viewActions">看轉檔進度</button>
    </div>

    <div id="progress">
      <div class="bar"><i id="barFill"></i></div>
      <div class="log" id="log"></div>
    </div>

    <div class="callout">
      <b>網站開不起來？</b>有些網站不准被嵌在別的頁面裡。
      維基百科要用手機版 <code>zh.m.wikipedia.org</code>（電腦版會被擋），
      YouTube、Google 也不行。按每一列的「試」可以先確認。
    </div>
  </div>

  <div class="nav">
    <a href="./">◱ 測試頁</a>
    <a href="play.html">▶ 刷卡展示頁</a>
    <a href="模擬刷卡.html">⊹ 模擬刷卡</a>
  </div>

</div>
</div>

<script src="assets/config.js"></script>
<script>
const { OWNER, REPO, BRANCH } = CONFIG;

const files    = {};       // { 1: File }  這次要上傳的影片
const original = {};       // 剛載入時的設定，用來比對有沒有改過

/* ══════════════════════════════════════════════════════
 *  金鑰
 * ══════════════════════════════════════════════════════ */

const savedKey = localStorage.getItem('ghToken');
if (savedKey) {
  $('#token').value = savedKey;
  $('#keyrow').classList.add('has');
}

$('#saveKey').onclick = () => {
  const t = $('#token').value.trim();
  if (!t) {
    localStorage.removeItem('ghToken');
    $('#keyrow').classList.remove('has');
    return;
  }
  localStorage.setItem('ghToken', t);
  $('#keyrow').classList.add('has');
};

$('#viewActions').onclick = () =>
  window.open(`https://github.com/${OWNER}/${REPO}/actions`, '_blank', 'noopener');

$('#reload').onclick = () => location.reload();

/* ══════════════════════════════════════════════════════
 *  建立 8 列
 * ══════════════════════════════════════════════════════ */

loadCards().then(build);

function build() {
  const box = $('#cards');
  box.innerHTML = '';

  SLOTS.forEach(n => {
    const c = cardOf(n);
    original[n] = JSON.stringify(c);

    const row = document.createElement('div');
    row.className = 'cardrow ' + (c.type === 'site' ? 'site' : 'video');
    row.id = 'row' + n;

    row.innerHTML = `
      <div class="head-row">
        <span class="no">${n}</span>
        <input class="t-in" id="t${n}" value="${esc(c.title || '第 ' + n + ' 張')}"
               placeholder="標題（刷卡時顯示）">
        <span class="toggle">
          <button class="mode-site ${c.type === 'site' ? 'act' : ''}">網站</button>
          <button class="mode-video ${c.type !== 'site' ? 'act' : ''}">影片</button>
        </span>
      </div>

      <div class="body-row" id="body${n}"></div>
      <div class="note" id="note${n}"></div>`;

    row.querySelector('.mode-site').onclick  = () => setMode(n, 'site');
    row.querySelector('.mode-video').onclick = () => setMode(n, 'video');
    row.querySelector('.t-in').oninput = () => markEdited(n);

    // 整列都能拖檔案進來
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('over'); });
    row.addEventListener('dragleave', () => row.classList.remove('over'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (!f) return;
      setMode(n, 'video');          // 拖影片進來 = 想用影片模式
      takeFile(n, f);
    });

    box.appendChild(row);
    renderBody(n, c);
  });

  ['dragover', 'drop'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault())
  );

  updateSummary();
  SLOTS.forEach(checkVideoOnline);
}

const esc = s => String(s ?? '').replace(/"/g, '&quot;').replace(/</g, '&lt;');

/* ── 畫出一列的內容區 ─────────────────────────────────── */

function renderBody(n, c) {
  const body = $('#body' + n);

  if (c.type === 'site') {
    body.innerHTML = `
      <input class="u-in" id="u${n}" value="${esc(c.url || '')}"
             placeholder="https://..." spellcheck="false" autocomplete="off">
      <button class="testbtn" id="try${n}">試</button>`;

    $('#u' + n).oninput = () => { markEdited(n); validateUrl(n); };
    $('#try' + n).onclick = () => tryOpen(n);
    validateUrl(n);

  } else {
    body.innerHTML = `
      <div class="filebox" id="f${n}">點這裡選影片，或把檔案拖進來</div>
      <button class="pickbtn" id="p${n}">選檔案</button>`;

    $('#f' + n).onclick = () => pick(n);
    $('#p' + n).onclick = () => pick(n);

    if (files[n]) showFile(n, files[n]);
    else checkVideoOnline(n);
  }
}

/* ── 切換模式 ─────────────────────────────────────────── */

function setMode(n, mode) {
  const row = $('#row' + n);
  if (row.classList.contains(mode)) return;

  row.classList.remove('site', 'video');
  row.classList.add(mode);

  row.querySelector('.mode-site').classList.toggle('act', mode === 'site');
  row.querySelector('.mode-video').classList.toggle('act', mode === 'video');

  renderBody(n, { type: mode, url: currentUrl(n) });
  markEdited(n);
  updateSummary();
}

// 記住使用者填過的網址，切回網站模式時不要不見
const urlMemo = {};
function currentUrl(n) {
  const el = $('#u' + n);
  if (el) urlMemo[n] = el.value;
  return urlMemo[n] ?? (cardOf(n).url || '');
}

/* ── 選檔案 ───────────────────────────────────────────── */

const NOT_VIDEO = /\.(html?|txt|md|pdf|zip|rar|7z|docx?|xlsx?|pptx?|jpe?g|png|gif|webp|svg|mp3|wav|m4a|json|js|css|exe|dmg)$/i;

function pick(n) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'video/*';
  inp.onchange = () => { if (inp.files[0]) takeFile(n, inp.files[0]); };
  inp.click();
}

function takeFile(n, f) {
  // 拖曳進來的檔案不會過 accept="video/*"，要自己擋
  if (NOT_VIDEO.test(f.name) || (f.type && !f.type.startsWith('video/'))) {
    alert(
      `「${f.name}」看起來不是影片檔。\n\n` +
      '這裡只收影片（mp4 / mov / avi / mkv 等）。\n' +
      '如果你是想讓刷卡打開某個網站，把這張卡切成「網站」模式填網址就好。'
    );
    return;
  }

  const mb = f.size / 1048576;
  if (mb > 100) {
    alert(`這個檔案有 ${mb.toFixed(0)}MB，超過 GitHub 的 100MB 上限。\n請把影片剪短，或先壓縮一下。`);
    return;
  }

  files[n] = f;
  showFile(n, f);
  markEdited(n);
}

function showFile(n, f) {
  const el = $('#f' + n);
  if (!el) return;
  el.classList.add('has');
  el.textContent = `${f.name} · ${(f.size / 1048576).toFixed(1)}MB`;
  el.title = f.name;
}

/* ── 網站上已經有的影片，標一下 ───────────────────────── */

async function checkVideoOnline(n) {
  if (cardOf(n).type === 'site' && !$('#f' + n)) return;
  if (files[n]) return;

  const el = $('#f' + n);
  if (!el) return;

  try {
    const r = await fetch(`videos/${n}.mp4`, { method: 'HEAD', cache: 'no-store' });
    if (!r.ok) return;
    const bytes = Number(r.headers.get('content-length') || 0);
    if (bytes < 20000) return;

    if (files[n]) return;
    el.textContent = `目前 ${(bytes / 1048576).toFixed(1)}MB（不換的話就用這個）`;
  } catch {}
}

/* ── 網址檢查 ─────────────────────────────────────────── */

function validateUrl(n) {
  const el = $('#u' + n);
  if (!el) return true;

  const v = el.value.trim();
  const note = $('#note' + n);

  if (!v) { el.classList.remove('bad'); note.className = 'note'; return true; }

  let ok = false;
  try { const u = new URL(v); ok = u.protocol === 'https:' || u.protocol === 'http:'; } catch {}

  el.classList.toggle('bad', !ok);

  if (!ok) {
    note.className = 'note on err';
    note.textContent = '網址格式怪怪的，要以 https:// 開頭';
    return false;
  }

  // 已知擋嵌入的網站，先提醒
  if (/^https?:\/\/(zh|en|ja|www)\.wikipedia\.org/i.test(v)) {
    note.className = 'note on warn';
    note.innerHTML = '維基百科電腦版不能嵌入，請把網址的 <code>zh.wikipedia.org</code> 改成 <code>zh.m.wikipedia.org</code>';
  } else if (/youtube\.com\/watch|google\.com\/search/i.test(v)) {
    note.className = 'note on warn';
    note.textContent = '這個網站通常不准被嵌入，展示時可能會空白。建議先按「試」確認。';
  } else {
    note.className = 'note';
  }
  return true;
}

/* ── 試開一下 ─────────────────────────────────────────── */

function tryOpen(n) {
  const v = $('#u' + n)?.value.trim();
  if (!v) { alert('先填網址'); return; }
  window.open(v, '_blank', 'noopener');
}

/* ── 標記改過 ─────────────────────────────────────────── */

function markEdited(n) {
  const row = $('#row' + n);
  row.classList.remove('done');

  const now = JSON.stringify(readRow(n));
  row.classList.toggle('edited', now !== original[n] || !!files[n]);

  updateSummary();
}

function readRow(n) {
  const row  = $('#row' + n);
  const mode = row.classList.contains('site') ? 'site' : 'video';
  const c = {
    type:  mode,
    title: $('#t' + n)?.value.trim() || `第 ${n} 張`,
  };
  if (mode === 'site') c.url = $('#u' + n)?.value.trim() || '';
  return c;
}

function updateSummary() {
  const changed = SLOTS.filter(n => $('#row' + n)?.classList.contains('edited'));
  const sites   = SLOTS.filter(n => $('#row' + n)?.classList.contains('site'));
  const vids    = CONFIG.COUNT - sites.length;

  const chip = $('#chipSum');
  const txt  = $('#sumText');

  if (changed.length) {
    chip.className = 'chip edit';
    chip.textContent = `${changed.length} 張已修改`;
    txt.textContent = `第 ${changed.join('、')} 張有改動，記得按儲存。`;
  } else {
    chip.className = 'chip';
    chip.textContent = '尚未修改';
    txt.textContent = `目前 ${sites.length} 張開網站` + (vids ? `、${vids} 張放影片` : '') + '。';
  }
}

/* ══════════════════════════════════════════════════════
 *  記錄
 * ══════════════════════════════════════════════════════ */

function say(msg, cls = '') {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  $('#log').appendChild(line);
  $('#log').scrollTop = $('#log').scrollHeight;
}
const setBar = pct => $('#barFill').style.width = pct + '%';

/* ══════════════════════════════════════════════════════
 *  檔案 → base64（GitHub API 只收這種格式）
 * ══════════════════════════════════════════════════════ */

function toBase64(blob, onProgress) {
  return new Promise((resolve, reject) => {
    const CHUNK  = 2 * 1048576;
    const reader = new FileReader();
    let offset = 0;
    let binary = '';

    reader.onerror = () => reject(new Error('讀取檔案失敗'));

    reader.onload = () => {
      const bytes = new Uint8Array(reader.result);
      for (let i = 0; i < bytes.length; i += 32768) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
      }
      offset = Math.min(offset + CHUNK, blob.size);
      onProgress?.(offset / blob.size);

      if (offset < blob.size) readNext();
      else resolve(btoa(binary));
    };

    function readNext() {
      reader.readAsArrayBuffer(blob.slice(offset, offset + CHUNK));
    }
    readNext();
  });
}

// 中文字元用 btoa 會爆，要先轉成 UTF-8 位元組
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.length; i += 32768) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  }
  return btoa(binary);
}

/* ══════════════════════════════════════════════════════
 *  呼叫 GitHub
 * ══════════════════════════════════════════════════════ */

async function gh(path, opts = {}) {
  const token = $('#token').value.trim();
  return fetch(`https://api.github.com/repos/${OWNER}/${REPO}${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Accept':        'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.headers || {}),
    },
  });
}

async function ghError(res) {
  const e = await res.json().catch(() => ({}));
  return e.message || `HTTP ${res.status}`;
}

/* ══════════════════════════════════════════════════════
 *  儲存
 *
 *  設定檔和影片一起打包成「一次」commit，
 *  這樣轉檔機器人只會被叫醒一次，也不會有半新半舊的狀態。
 * ══════════════════════════════════════════════════════ */

$('#go').onclick = async () => {
  const token = $('#token').value.trim();
  if (!token) { alert('請先貼上金鑰'); return; }

  // 先檢查網址有沒有問題
  const bad = SLOTS.filter(n => {
    const row = $('#row' + n);
    if (!row.classList.contains('site')) return false;
    const v = $('#u' + n)?.value.trim();
    return !v || !validateUrl(n);
  });

  if (bad.length) {
    alert(`第 ${bad.join('、')} 張的網址還沒填好。`);
    return;
  }

  const cards   = SLOTS.map(readRow);
  const upload  = Object.keys(files).map(Number)
                    .filter(n => cards[n - 1].type === 'video')
                    .sort((a, b) => a - b);

  const cfgChanged = SLOTS.some(n => JSON.stringify(cards[n - 1]) !== original[n]);

  if (!cfgChanged && !upload.length) {
    alert('沒有任何改動');
    return;
  }

  $('#go').disabled = true;
  $('#go').textContent = '儲存中…';
  $('#progress').style.display = 'block';
  $('#log').innerHTML = '';
  setBar(0);

  const guard = e => { e.preventDefault(); e.returnValue = ''; };
  window.addEventListener('beforeunload', guard);

  try {
    /* ── 驗金鑰 ─────────────────────────────────── */
    say('檢查金鑰…', 'dim');
    const check = await gh('');

    if (check.status === 401) { say('金鑰無效或已過期', 'err'); return; }
    if (check.status === 403) { say('金鑰權限不足，建立時要勾 repo', 'err'); return; }
    if (check.status === 404) { say('找不到倉庫，或這組金鑰沒有權限', 'err'); return; }
    if (!check.ok)            { say(`連線失敗（${check.status}）`, 'err'); return; }

    const repo = await check.json();
    if (!repo.permissions?.push) {
      say('這組金鑰只能讀、不能寫，請重新建立並勾 repo', 'err');
      return;
    }
    say('金鑰沒問題', 'ok');

    const treeItems = [];

    /* ── 設定檔 ─────────────────────────────────── */
    if (cfgChanged) {
      say('\n打包卡片設定…', 'dim');
      const json = JSON.stringify({
        '_說明': '8 張卡各自要做什麼。可以直接改這裡，也可以用設定面板改（upload.html）。',
        cards,
      }, null, 2) + '\n';

      const blob = await gh('/git/blobs', {
        method: 'POST',
        body: JSON.stringify({ content: utf8ToBase64(json), encoding: 'base64' }),
      });

      if (!blob.ok) { say(`設定檔失敗：${await ghError(blob)}`, 'err'); return; }

      treeItems.push({
        path: 'assets/cards.json', mode: '100644', type: 'blob',
        sha: (await blob.json()).sha,
      });
      say('設定已打包', 'ok');
    }

    /* ── 影片 ───────────────────────────────────── */
    const okVideos = [];

    if (upload.length) {
      const totalBytes = upload.reduce((s, n) => s + files[n].size, 0);
      let doneBytes = 0;

      // 讀 raw/ 現有的檔案，等下把同編號的舊檔清掉
      const oldFiles = [];
      const rawRes = await gh(`/contents/raw?ref=${BRANCH}`);
      if (rawRes.ok) {
        const arr = await rawRes.json();
        if (Array.isArray(arr)) oldFiles.push(...arr.map(f => f.name));
      }

      for (const n of upload) {
        const f   = files[n];
        const ext = (f.name.match(/\.[^.]+$/) || ['.mp4'])[0].toLowerCase();
        const mb  = f.size / 1048576;

        say(`\n第 ${n} 張影片　${f.name}（${mb.toFixed(1)}MB）`);

        // GitHub 單次請求約 20MB 上限，切 10MB 保險
        const PART  = 10 * 1048576;
        const parts = Math.ceil(f.size / PART);
        if (parts > 1) say(`  太大，切成 ${parts} 塊送`, 'warn');

        const shas = [];
        let failed = false;

        for (let i = 0; i < parts; i++) {
          const slice = f.slice(i * PART, (i + 1) * PART);
          const label = parts > 1 ? `第 ${i + 1}/${parts} 塊` : '檔案';

          const b64 = await toBase64(slice, p => {
            const cur = doneBytes + i * PART + p * slice.size;
            setBar(Math.round((cur / totalBytes) * 80));
          });

          say(`  ${label} 上傳中…`, 'dim');
          const r = await gh('/git/blobs', {
            method: 'POST',
            body: JSON.stringify({ content: b64, encoding: 'base64' }),
          });

          if (!r.ok) { say(`  失敗：${await ghError(r)}`, 'err'); failed = true; break; }
          shas.push((await r.json()).sha);
        }

        doneBytes += f.size;
        if (failed) { say(`  第 ${n} 張沒傳成功，跳過`, 'err'); continue; }

        shas.forEach((sha, i) => {
          treeItems.push({
            path: parts === 1
              ? `raw/${n}${ext}`
              : `raw/${n}${ext}.part${String(i + 1).padStart(3, '0')}`,
            mode: '100644', type: 'blob', sha,
          });
        });

        okVideos.push(n);
        say(`  第 ${n} 張好了`, 'ok');
      }

      // 同編號的舊檔標記刪除，免得 raw/1.mov 和 raw/1.mp4 並存
      const keep = new Set(treeItems.map(t => t.path.replace(/^raw\//, '')));
      for (const name of oldFiles) {
        const m = name.match(/^(\d+)\./);
        if (!m || !okVideos.includes(Number(m[1])) || keep.has(name)) continue;
        treeItems.push({ path: `raw/${name}`, mode: '100644', type: 'blob', sha: null });
      }
    }

    if (!treeItems.length) { say('\n沒有東西要存', 'warn'); return; }

    /* ── 一次 commit ────────────────────────────── */
    say('\n寫回 GitHub…', 'dim');
    setBar(88);

    const parts = [];
    if (cfgChanged)      parts.push('卡片設定');
    if (okVideos.length) parts.push(`第 ${okVideos.join('、')} 張影片`);

    if (!await commitAll(treeItems, '更新' + parts.join('、'))) return;

    setBar(100);

    // 更新基準，這樣「已修改」標記會歸零
    SLOTS.forEach(n => {
      original[n] = JSON.stringify(cards[n - 1]);
      delete files[n];
      const row = $('#row' + n);
      row.classList.remove('edited');
      if (okVideos.includes(n) || cfgChanged) row.classList.add('done');
    });
    updateSummary();

    say('\n────────────────────────');
    say('儲存完成', 'ok');

    if (okVideos.length) {
      say('影片正在自動轉檔，約 3~5 分鐘');
      watchConvert();
    } else {
      say('約 1~2 分鐘後所有平板都會吃到新設定', 'ok');
    }

  } catch (err) {
    say(`\n出錯了：${err.message}`, 'err');
  } finally {
    window.removeEventListener('beforeunload', guard);
    $('#go').disabled = false;
    $('#go').textContent = '儲存設定';
  }
};

/* ══════════════════════════════════════════════════════
 *  建立一筆 commit，把所有檔案一次掛上去
 * ══════════════════════════════════════════════════════ */

async function commitAll(treeItems, message) {
  const refRes = await gh(`/git/ref/heads/${BRANCH}`);
  if (!refRes.ok) { say(`讀取分支失敗：${await ghError(refRes)}`, 'err'); return false; }
  const baseSha = (await refRes.json()).object.sha;

  const commitRes = await gh(`/git/commits/${baseSha}`);
  if (!commitRes.ok) { say(`讀取紀錄失敗：${await ghError(commitRes)}`, 'err'); return false; }
  const baseTree = (await commitRes.json()).tree.sha;

  const treeRes = await gh('/git/trees', {
    method: 'POST',
    body: JSON.stringify({ base_tree: baseTree, tree: treeItems }),
  });
  if (!treeRes.ok) { say(`建立結構失敗：${await ghError(treeRes)}`, 'err'); return false; }
  const newTree = (await treeRes.json()).sha;

  const newCommitRes = await gh('/git/commits', {
    method: 'POST',
    body: JSON.stringify({ message, tree: newTree, parents: [baseSha] }),
  });
  if (!newCommitRes.ok) { say(`建立紀錄失敗：${await ghError(newCommitRes)}`, 'err'); return false; }
  const newCommit = (await newCommitRes.json()).sha;

  const upd = await gh(`/git/refs/heads/${BRANCH}`, {
    method: 'PATCH',
    body: JSON.stringify({ sha: newCommit }),
  });
  if (!upd.ok) { say(`更新分支失敗：${await ghError(upd)}`, 'err'); return false; }

  return true;
}

/* ══════════════════════════════════════════════════════
 *  追蹤轉檔進度
 * ══════════════════════════════════════════════════════ */

async function watchConvert() {
  say('\n追蹤轉檔進度中…', 'dim');
  let noRun = 0;

  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 5000));

    const r = await gh('/actions/runs?per_page=1');
    if (!r.ok) { say('（讀不到進度，請自己看 Actions 頁面）', 'warn'); return; }

    const run = (await r.json()).workflow_runs?.[0];
    if (!run) {
      if (++noRun > 6) { say('（還沒看到轉檔工作，請自己看 Actions 頁面）', 'warn'); return; }
      continue;
    }

    if (run.status === 'completed') {
      if (run.conclusion === 'success') {
        say('轉檔完成，內容已經上線', 'ok');
        say('可以去測試頁確認', 'ok');
      } else {
        say(`轉檔失敗（${run.conclusion}），按「看轉檔進度」查原因`, 'err');
      }
      return;
    }

    if (i % 3 === 0) say(`  轉檔中…（${run.status === 'queued' ? '排隊中' : '進行中'}）`, 'dim');
  }

  say('（等太久了，請按「看轉檔進度」自己看）', 'warn');
}
